# Static CRT linking for Windows MSVC — the binary works on any Windows
# machine without requiring the Visual C++ Redistributable to be installed.
[target.x86_64-pc-windows-msvc]
linker = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\link.exe"
rustflags = ["-C", "target-feature=+crt-static"]
