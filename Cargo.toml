[package]
name = "mdnav"
version = "0.1.16"
edition = "2021"
description = "Terminal navigator for MkDocs and Markdown documentation trees"

[dependencies]
anyhow = "1"
crossterm = "0.28"
pulldown-cmark = "0.12"
ratatui = "0.29"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
arboard = "3"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
toml = "1"
serde-saphyr = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
mysql = { version = "25", default-features = false, features = ["minimal", "buffer-pool", "derive", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = "1"
rust_decimal = { version = "1", features = ["db-postgres"] }
