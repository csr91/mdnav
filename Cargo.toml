[package]
name = "mdnav"
version = "0.1.16"
edition = "2021"
description = "Terminal navigator for MkDocs and Markdown documentation trees"

[dependencies]
anyhow = "1"
crossterm = "0.28"
pulldown-cmark = "0.12"
ratatui = "0.29"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
arboard = "3"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
toml = "1"
serde-saphyr = "1"
# Already built for reqwest: these features add no crates. The HTTP client
# runs async reqwest on a current-thread runtime so a request can be cancelled.
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync", "time"] }
