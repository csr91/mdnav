# Variables secretas: en environments/public.yml, demo_api_key esta como
#   - secret: true
#     name: demo_api_key
# El archivo no guarda el valor: mdnav lo busca con el mismo nombre en
# api/.env (y si no esta, en las variables de entorno del sistema):
#   demo_api_key=mi-clave
info:
  name: API key secreta
  type: http
  seq: 7
http:
  method: GET
  url: "{{echo_api}}/anything/reportes"
  auth:
    type: apikey
    key: X-Api-Key # nombre del header (o del query param)
    value: "{{demo_api_key}}"
    placement: header # cambialo a query para mandarla como ?X-Api-Key=...
settings:
  encodeUrl: true
docs: |-
  Agrega demo_api_key=mi-clave a api/.env y envialo: el header X-Api-Key
  aparece en "headers" de la response. Con placement: query aparece en "args".
