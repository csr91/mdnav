name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Build release
        run: cargo build --locked --release

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/mdnav-windows-x86_64 | Out-Null
          Copy-Item target/release/mdnav.exe dist/mdnav-windows-x86_64/mdnav.exe
          Copy-Item README.md dist/mdnav-windows-x86_64/README.md
          Compress-Archive -Path dist/mdnav-windows-x86_64/* -DestinationPath dist/mdnav-windows-x86_64.zip -Force

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/mdnav-linux-x86_64
          cp target/release/mdnav README.md dist/mdnav-linux-x86_64/
          tar -czf dist/mdnav-linux-x86_64.tar.gz -C dist/mdnav-linux-x86_64 .

      - name: Upload Windows release
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: dist/mdnav-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload Linux release
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: dist/mdnav-linux-x86_64.tar.gz
          if-no-files-found: error
